services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: alea_intake
      POSTGRES_USER: alea
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alea -d alea_intake"]
      interval: 5s
      timeout: 3s
      retries: 5
