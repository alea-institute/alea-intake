name: Post-deploy smoke (dev)

# After a push to master, Railway auto-deploys alea-intake-dev. This workflow waits
# until /health reports the exact pushed commit is live, then runs the live E2E smoke
# test (scripts/smoke_live.py). No secrets required — it uses only public endpoints
# and the commit SHA that Railway injects into /health.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Wait for the deploy, then run the live smoke test
        env:
          BASE_URL: https://alea-intake-dev-production.up.railway.app
          EXPECT_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            echo "Waiting for $BASE_URL to report commit $EXPECT_SHA (up to ~25 min)..."
            ok=0
            for i in $(seq 1 75); do
              live=$(curl -fsS --max-time 20 "$BASE_URL/health" | jq -r '.commit // ""' || echo "")
              echo "poll $i: live=${live:0:9} expect=${EXPECT_SHA:0:9}"
              if [ "$live" = "$EXPECT_SHA" ]; then ok=1; echo "Pushed commit is live."; break; fi
              sleep 20
            done
            if [ "$ok" != "1" ]; then
              echo "::error::Timed out waiting for $EXPECT_SHA to deploy to $BASE_URL"
              exit 1
            fi
          fi
          python3 scripts/smoke_live.py "$BASE_URL"
