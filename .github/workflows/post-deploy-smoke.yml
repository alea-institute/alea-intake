name: Post-deploy smoke (dev)

# After a push to master, Railway auto-deploys alea-intake-dev. This workflow waits
# until /health reports the exact pushed commit is live, then runs the live E2E smoke
# test (scripts/smoke_live.py). No secrets required — it uses only public endpoints
# and the commit SHA that Railway injects into /health.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL to smoke test
        default: https://alea-intake-dev-production.up.railway.app

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: true

env:
  BASE_URL: ${{ github.event.inputs.base_url || 'https://alea-intake-dev-production.up.railway.app' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for the pushed commit to be live on dev
        # workflow_dispatch has no meaningful github.sha vs deploy match, so only
        # gate on the SHA for push events; dispatch runs the smoke immediately.
        if: github.event_name == 'push'
        env:
          EXPECT_SHA: ${{ github.sha }}
        run: |
          echo "Waiting for $BASE_URL to report commit $EXPECT_SHA (up to ~25 min)..."
          for i in $(seq 1 75); do
            BODY=$(curl -fsS --max-time 20 "$BASE_URL/health" 2>/dev/null || echo '{}')
            LIVE=$(printf '%s' "$BODY" | python3 -c "import sys,json
try: print(json.load(sys.stdin).get('commit') or '')
except Exception: print('')")
            STATUS=$(printf '%s' "$BODY" | python3 -c "import sys,json
try: print(json.load(sys.stdin).get('status') or '?')
except Exception: print('?')")
            echo "poll $i: live=${LIVE:0:9} expect=${EXPECT_SHA:0:9} status=$STATUS"
            if [ "$LIVE" = "$EXPECT_SHA" ]; then echo "Pushed commit is live."; exit 0; fi
            sleep 20
          done
          echo "::error::Timed out waiting for $EXPECT_SHA to deploy to $BASE_URL"
          exit 1

      - name: Run live E2E smoke test
        run: python3 scripts/smoke_live.py "$BASE_URL"
