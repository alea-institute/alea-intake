[project]
name = "alea-intake-backend"
version = "0.1.0"
description = "ALEA Intake - Legal intake tool backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.0,<1.0",
    "uvicorn[standard]>=0.42.0",
    "sqlalchemy[asyncio]>=2.0.48",
    "alembic>=1.18.0",
    "pydantic[email]>=2.12.0",
    "pydantic-settings>=2.13.0",
    "pyjwt>=2.12.0",
    "pwdlib[argon2]>=0.3.0",
    "cryptography>=46.0.0",
    "python-multipart>=0.0.22",
    "python-dotenv>=1.2.0",
    "alea-llm-client>=0.3.0",
    "httpx>=0.28.0",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.0",
    "aiosqlite>=0.22.0",
    "pgvector>=0.4.0",
    "folio-python[search]>=0.2.1",
    "faiss-cpu>=1.13.0",
    "sentence-transformers>=5.0.0",
    "lxml>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "factory-boy>=3.0",
    "ruff>=0.9",
    "pytest-timeout>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
