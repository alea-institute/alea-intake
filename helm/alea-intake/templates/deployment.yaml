apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alea-intake.fullname" . }}
  labels:
    {{- include "alea-intake.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "alea-intake.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "alea-intake.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "alea-intake.fullname" . }}-config
          env:
            - name: ALEA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "alea-intake.appSecretName" . }}
                  key: secret-key
            - name: ALEA_MASTER_KEY_PATH
              value: /app/data/master.key
            {{- if eq .Values.database.backend "postgresql" }}
            - name: ALEA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "alea-intake.dbSecretName" . }}
                  key: {{ .Values.database.existingSecretPasswordKey | default "password" }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.dataVolume.enabled }}
          volumeMounts:
            - name: data
              mountPath: /app/data
          {{- end }}
      {{- if .Values.persistence.dataVolume.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "alea-intake.fullname" . }}-data
      {{- end }}
