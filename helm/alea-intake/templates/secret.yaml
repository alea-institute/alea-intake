{{/*
Create application secrets only if no existing secret is referenced.
In production, always use existingSecret to reference a pre-created
Kubernetes Secret with real credentials. Never commit real secrets
to values.yaml.
*/}}
{{- if not .Values.appSecret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alea-intake.fullname" . }}-app
  labels:
    {{- include "alea-intake.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # REPLACE THESE with real values before deploying to production
  secret-key: "CHANGE-ME-generate-a-random-key"
  master-key: "CHANGE-ME-generate-a-random-key"
{{- end }}
---
{{- if and (eq .Values.database.backend "postgresql") (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alea-intake.fullname" . }}-db
  labels:
    {{- include "alea-intake.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # REPLACE with real database password before deploying to production
  {{ .Values.database.existingSecretPasswordKey | default "password" }}: "CHANGE-ME-set-database-password"
{{- end }}
