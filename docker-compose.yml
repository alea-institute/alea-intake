services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: alea_intake
      POSTGRES_USER: alea
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alea -d alea_intake"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    environment:
      ALEA_DATABASE_BACKEND: postgresql
      ALEA_DB_HOST: db
      ALEA_DB_PORT: "5432"
      ALEA_DB_NAME: alea_intake
      ALEA_DB_USER: alea
      ALEA_DB_PASSWORD: ${DB_PASSWORD:-changeme}
      ALEA_SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ALEA_MASTER_KEY_PATH: /app/data/master.key
    volumes:
      - app_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  app_data:
