# ALEA Intake - Single-Tenant Quick Start
#
# Quick start: docker compose up -d
# Access:      http://localhost:8000
#
# Uses SQLite for zero-dependency setup.
# For multi-tenant with PostgreSQL, see docker-compose.multi.yml

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    environment:
      ALEA_DEPLOYMENT_MODE: single_tenant
      ALEA_DATABASE_BACKEND: sqlite
      ALEA_SQLITE_PATH: /app/data/alea_intake.db
      ALEA_SECRET_KEY: ${ALEA_SECRET_KEY:-CHANGE-ME-generate-a-random-key}
      ALEA_MASTER_KEY_PATH: /app/data/master.key
      ALEA_PERSISTENCE_MODE: persistent
      ALEA_LOG_LEVEL: INFO
      ALEA_LOG_FORMAT: json
    volumes:
      - alea_data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  alea_data:
